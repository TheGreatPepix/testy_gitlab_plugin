<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TestY · Автотесты GitLab{% endblock %}</title>
  <script>
    (function () {
      var effectiveTheme;
      try {
        var root = JSON.parse(localStorage.getItem("persist:root") || "{}");
        var theme = JSON.parse(root.theme || "{}");
        effectiveTheme = theme.themeType === "system" ? theme.themeValue : theme.themeType;
      } catch (error) {}
      if (effectiveTheme !== "dark" && effectiveTheme !== "light") {
        effectiveTheme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", effectiveTheme);
    })();
  </script>
  <style>
    :root {
      --bg:#fff; --surface:#f6f6f6; --text:#404040; --muted:#666;
      --border:#dfdfdf; --accent:#425cd7; --accent-hover:#4e6bf3;
      --success-bg:#eef7f2; --success:#287c50; --error-bg:#faeeef; --error:#c9454f;
      --warning-bg:#fef8e9; --warning:#946b00; --pending-bg:#eee; --pending:#555;
    }
    html[data-theme="dark"] {
      --bg:#262626; --surface:#1f1f1f; --text:#dfdfdf; --muted:#b8b8b8;
      --border:#484848; --accent:#4e6bf3; --accent-hover:#637eff;
      --success-bg:#2e4137; --success:#55c98d; --error-bg:#462e30; --error:#e06a72;
      --warning-bg:#4e4325; --warning:#f4cc64; --pending-bg:#404040; --pending:#b8b8b8;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; padding:0; }
    body {
      background:var(--bg); color:var(--text); font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    .topbar {
      display:flex; align-items:center; padding:11px 24px; background:var(--surface);
      border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;
    }
    .brand { color:var(--text); font-weight:700; text-decoration:none; }
    .brand:hover { color:var(--accent); }
    main { max-width:980px; padding:24px 28px 48px; }
    h1 { margin:0 0 6px; font-size:1.6rem; }
    h2 { margin:30px 0 10px; font-size:1.15rem; }
    h3 { margin:0 0 12px; font-size:1rem; }
    p { margin:0 0 12px; }
    a { color:var(--accent); }
    code, .mono {
      font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    }
    code { background:var(--surface); border:1px solid var(--border); padding:1px 5px; }
    .card code { background:var(--bg); }
    .lead, .hint { color:var(--muted); }
    .hint { font-size:12px; }
    small { color:var(--muted); }

    .proj-picker { display:flex; align-items:center; gap:10px; margin:18px 0 0; }
    .proj-picker select { width:auto; min-width:260px; }
    .tabs { display:flex; gap:2px; border-bottom:1px solid var(--border); margin:16px 0 0; }
    .tabs a {
      padding:8px 16px; color:var(--muted); font-weight:600; text-decoration:none;
      border-bottom:2px solid transparent; margin-bottom:-1px;
    }
    .tabs a:hover { color:var(--text); }
    .tabs a.is-active { color:var(--accent); border-bottom-color:var(--accent); }

    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; margin-top:22px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:5px; padding:18px; }
    .card > .hint:last-child, .card > p:last-child { margin-bottom:0; }
    .new-token { border-color:var(--accent); margin-top:20px; }
    .field { display:flex; flex-direction:column; gap:5px; margin:14px 0; }
    .field .hint { margin:0; }
    .field-row { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
    label { color:var(--muted); font-size:12px; font-weight:600; }
    .check { display:flex; align-items:center; gap:8px; margin:14px 0; color:var(--text); font-size:14px; font-weight:500; }
    .check input { width:auto; margin:0; }
    input, select {
      width:100%; padding:8px 10px; color:var(--text); background:var(--bg);
      border:1px solid var(--border); border-radius:3px; font:inherit;
    }
    input:focus, select:focus { outline:none; border-color:var(--accent); }
    .token-copy { display:flex; gap:8px; }
    .token-copy input { flex:1; }
    button {
      padding:8px 13px; border:1px solid var(--border); border-radius:3px; cursor:pointer;
      background:var(--surface); color:var(--text); font:inherit; font-weight:600;
    }
    .card button:not(.primary) { background:var(--bg); }
    button:hover { border-color:var(--accent); }
    button.primary { color:#fff; background:var(--accent); border-color:var(--accent); }
    button.primary:hover { background:var(--accent-hover); }
    button.danger { color:var(--error); }
    button.danger:hover { border-color:var(--error); }
    .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:16px; }
    .divider { border:0; border-top:1px solid var(--border); margin:18px 0 0; }
    .last-run { margin:12px 0 0; }

    table { width:100%; border-collapse:collapse; }
    th, td { padding:9px 10px; border:1px solid var(--border); text-align:left; }
    th { background:var(--surface); }
    td.empty { color:var(--muted); text-align:center; }
    form.inline { display:inline; }

    .badge {
      display:inline-block; padding:1px 9px; border-radius:100px; font-size:12px; font-weight:600;
      background:var(--pending-bg); color:var(--pending);
    }
    .badge.running, .badge.triggered { background:var(--warning-bg); color:var(--warning); }
    .badge.success, .badge.finished { background:var(--success-bg); color:var(--success); }
    .badge.failed, .badge.error { background:var(--error-bg); color:var(--error); }

    .message { padding:10px 12px; margin:12px 0; border-left:3px solid var(--accent); background:var(--surface); }
    .message.success { border-color:var(--success); background:var(--success-bg); }
    .message.error { border-color:var(--error); background:var(--error-bg); }
    @media (max-width:640px) {
      main { padding:18px 14px 36px; }
      .token-copy { flex-direction:column; }
      .field-row { grid-template-columns:1fr; }
      .proj-picker { flex-direction:column; align-items:stretch; }
      .proj-picker select { width:100%; min-width:0; }
      .tabs { overflow-x:auto; scrollbar-width:none; }
      .tabs a { padding:8px 12px; white-space:nowrap; }
      .table-wrap { overflow-x:auto; }
    }
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="/">‹ TestY</a></header>
  <main>
    {% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
